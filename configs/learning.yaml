# Phase 2 clean-baseline experiment defaults; fitted parameters use training windows only.
dataset: data/phase2_v2_dev
output_dir: runs/phase2
seed: 20261031
evaluation_seed: 20261031
evaluation_windows_per_run: 256
baseline:
  method: pooled_signal_aware_ridge
  ridge_alpha: 1.0
  minimum_client_windows: 16
training:
  seed: 20261031
  device: cpu                         # cpu | cuda | auto (auto = CUDA GPU if available, else CPU)
  num_threads: 0                      # CPU threads (0 = use every core)
  deterministic: true
  hidden_size: 32
  layers: 1
  dropout: 0.0
  shared_size: 16
  learning_rate: 0.001
  batch_size: 256
  epochs: 150                         # maximum epochs
  min_epochs: 50                      # always train at least this many; early stopping cannot fire earlier
  early_stopping_patience: 15         # after min_epochs: stop when validation loss has not improved for 15 epochs
  regression_loss_weight: 1.0
  classification_loss_weight: 1.0
  max_train_windows: 30000
  max_validation_windows: 10000
  local_epochs: 1
federation:
  rounds: 20
  max_clients: 16
  cohort_seed: 20261031
  max_windows_per_client: 2000
  deadline_s: 300.0
  live_round_interval_s: 60.0
  transient_vehicle_participation_rate: 0.75
  aggregation: sample_weighted_model_weights
  rsu_self_update: true
iid:
  seed: 20261031
