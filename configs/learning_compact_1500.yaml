# Phase 2 experiments on the compact 1,500-sample budget (see docs/COMPACT_1500.md).
#   python -m trafma collect --config configs/data_compact_1500.yaml
#   python -m trafma train   --method central --config configs/learning_compact_1500.yaml
#   python -m trafma fedavg  --hierarchical   --config configs/learning_compact_1500.yaml
dataset: data/phase2_compact_1500
output_dir: runs/phase2_compact
seed: 20261031
evaluation_seed: 20261031
evaluation_windows_per_run: 75        # validation = 4 runs x 75 = 300 windows; test = 4 runs x 75 = 300 windows
baseline:
  method: pooled_signal_aware_ridge
  ridge_alpha: 1.0
  minimum_client_windows: 16
training:
  seed: 20261031
  device: auto                        # auto = CUDA GPU if PyTorch can see one, otherwise CPU
  num_threads: 0                      # CPU threads (0 = use every core). Ignored on a GPU
  deterministic: true
  hidden_size: 32
  layers: 1
  dropout: 0.0
  shared_size: 16
  learning_rate: 0.001
  batch_size: 64
  epochs: 150                         # maximum epochs
  min_epochs: 50                      # always train at least this many; early stopping cannot fire earlier
  early_stopping_patience: 15         # after min_epochs: stop when validation loss has not improved for 15 epochs
  regression_loss_weight: 1.0
  classification_loss_weight: 1.0
  max_train_windows: 1500             # central GRU trains on exactly 1,500 windows
  max_validation_windows: 300
  local_epochs: 5                     # epochs each FL client trains per round
federation:
  rounds: 100                         # 100 rounds chosen on validation results (30 rounds was under-trained; 200 gave only a small further gain)
  max_clients: 20                     # 4 persistent RSU learners + 16 vehicle clients
  cohort_seed: 20261031
  max_windows_per_client: 75          # 20 clients x 75 windows = 1,500 training windows
  require_full_client_budget: true    # every selected client must hold the full 75 windows
  deadline_s: 300.0
  live_round_interval_s: 60.0
  transient_vehicle_participation_rate: 0.75
  aggregation: sample_weighted_model_weights
  rsu_self_update: true
iid:
  seed: 20261031
