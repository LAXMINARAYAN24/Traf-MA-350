seed: 20261031
evaluation_seed: 20261031
evaluation_windows_per_run: 75
baseline:
  method: pooled_signal_aware_ridge
  ridge_alpha: 1.0
  minimum_client_windows: 16
training:
  seed: 20261031
  device: auto
  num_threads: 0
  deterministic: true
  hidden_size: 32
  layers: 1
  dropout: 0.0
  shared_size: 16
