federation:
  rounds: 100
  max_clients: 20
  cohort_seed: 20261031
  max_windows_per_client: 75
  require_full_client_budget: true
  deadline_s: 300.0
  live_round_interval_s: 60.0
  transient_vehicle_participation_rate: 0.75
